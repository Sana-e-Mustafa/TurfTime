<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurfTime - Owner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="owner-home.html">TurfTime</a>
      <div>
        <span class="text-white me-3">Hi, Owner</span>
        <a class="btn btn-light" href="index.html">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h3 class="mb-4">Owner dashboard</h3>
    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card text-center"><div class="card-body"><h6>My turfs</h6><h2>3</h2></div></div></div>
      <div class="col-md-4"><div class="card text-center"><div class="card-body"><h6>Today's bookings</h6><h2>5</h2></div></div></div>
      <div class="col-md-4"><div class="card text-center"><div class="card-body"><h6>Earnings (month)</h6><h2>Rs 85,000</h2></div></div></div>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <h5>My turfs</h5>
      <button class="btn btn-success btn-sm">Add turf</button>
    </div>
    <table class="table table-striped">
      <thead><tr><th>Name</th><th>Sport</th><th>Price/hr</th><th>Actions</th></tr></thead>
      <tbody>
        <tr><td>Green Arena</td><td>Football</td><td>Rs 4,000</td><td><button class="btn btn-sm btn-outline-primary">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
        <tr><td>Pitch Pro</td><td>Cricket</td><td>Rs 5,000</td><td><button class="btn btn-sm btn-outline-primary">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
