<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurfTime - Player</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-success navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="player-home.html">TurfTime</a>
      <div>
        <span class="text-white me-3">Hi, Player</span>
        <a class="btn btn-light" href="index.html">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h3 class="mb-4">Welcome, Player</h3>
    <div class="card mb-4"><div class="card-body">
      <h5>Find a turf</h5>
      <div class="row g-2">
        <div class="col-md-4"><select class="form-select"><option>Football</option><option>Cricket</option><option>Badminton</option></select></div>
        <div class="col-md-4"><select class="form-select"><option>Lahore</option><option>Karachi</option><option>Islamabad</option></select></div>
        <div class="col-md-4"><input type="date" class="form-control"></div>
      </div>
      <button class="btn btn-success mt-3">Search</button>
    </div></div>

    <h5>My bookings</h5>
    <table class="table table-striped">
      <thead><tr><th>Turf</th><th>Date</th><th>Slot</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Green Arena</td><td>12 Nov</td><td>7-8 PM</td><td><span class="badge bg-success">Confirmed</span></td></tr>
        <tr><td>Smash Court</td><td>15 Nov</td><td>8-9 PM</td><td><span class="badge bg-warning text-dark">Pending</span></td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
